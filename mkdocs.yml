site_name: 飞雨的个人主页
site_description: 个人学习记录、项目展示与技术笔记
site_author: 朱亚超
site_url: https://siberiagroundhog.github.io/

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

nav:
  - 首页: index.md
  - 关于我: about.md
  - 项目:
      - 项目总览: projects/index.md
      - GitHub Pages建站: projects/github-pages.md
  - 学习笔记:
      - 笔记总览: notes/index.md
      - 网站维护流程: notes/mkdocs_publish_workflow.md
      - Mkdocs自定义说明: notes/mkdocs_custom.md
      - 机器学习笔记: notes/machine_learning.md
      - Logging库使用指南: notes/logging.md
  - 小游戏:
      - 游戏总览: games/index.md
      - 贪吃蛇: games/snake/index.md
      - 2048: games/2048/index.md
      - 扫雷: games/minesweeper/index.md
      - 小恐龙跑酷: games/dino-runner/index.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - fenced_code
  - attr_list
